name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements-api.txt }
      - run: pip install -r requirements-api.txt
      - name: Unit and integration tests (offline, fake LLMs)
        run: python -m pytest -q
      - name: Eval gate (retrieval, groundedness, red-team)
        run: python -m src.eval.ci_gate --badges
      - name: Red-team scoreboard is up to date
        run: |
          python -m src.eval.redteam --write > /dev/null
          git diff --exit-code docs/redteam-scoreboard.md

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
